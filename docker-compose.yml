services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    # This host's default resolv.conf lists internal corporate DNS servers
    # first, which can't resolve public hostnames like Neon's (they time out
    # before falling back to a public resolver) — go straight to public DNS
    # so resolving a remote DATABASE_URL host doesn't stall past Prisma's
    # connection timeout.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      # Node 22's dual-stack "Happy Eyeballs" connection algorithm hangs/times
      # out resolving Neon's pooler hostname in this container's network (IPv6
      # attempts go nowhere and starve the working IPv4 attempt out) — see the
      # comment on this same var in api/.env.example.
      NODE_OPTIONS: --no-network-family-autoselection
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${API_PORT:-3000}
      JWT_SECRET: ${JWT_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
