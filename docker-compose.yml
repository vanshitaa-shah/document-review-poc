services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: document_review
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/document_review
      PORT: 3000
      JWT_SECRET: change-me-in-real-deployments
      UPLOAD_DIR: /app/uploads
      OTEL_SERVICE_NAME: document-review-api
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://openobserve:5080/api/default/v1/logs
      OTEL_EXPORTER_OTLP_LOGS_HEADERS: "Authorization=Basic YWRtaW5AZXhhbXBsZS5jb206Q29tcGxleHBhc3MjMTIz"
    env_file:
      - path: ./api/.env
        required: false
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      openobserve:
        condition: service_started

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    restart: unless-stopped
    environment:
      ZO_ROOT_USER_EMAIL: admin@example.com
      ZO_ROOT_USER_PASSWORD: Complexpass#123
    ports:
      - "5080:5080"
    volumes:
      - openobserve_data:/data

volumes:
  postgres_data:
  uploads_data:
  openobserve_data:
