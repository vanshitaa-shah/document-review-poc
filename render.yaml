# Render blueprint — deploy as one Docker web service, database on Neon.
# In Render: New → Blueprint → connect this repo. Then set DATABASE_URL (and
# the Cloudinary keys) in the dashboard — see DATABASE_URL's comment below.
services:
  - type: web
    name: document-review-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    # Free plan for a $0 demo. Render's free web tier SLEEPS after ~15min idle
    # and its own filesystem is ephemeral on every plan tier — but uploaded
    # files live in Cloudinary (see lib/storage.ts), not on this container's
    # disk, so a restart/redeploy doesn't lose them. No persistent disk needed.
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      # Session/JWT signing secret — Render generates a strong value.
      - key: JWT_SECRET
        generateValue: true
      # Neon Postgres connection string — set manually in the Render dashboard
      # after the first deploy (neon.tech Console -> your project -> Connection
      # Details -> "Connection string", pooled connection). Must keep
      # `?sslmode=require`. `sync: false` means Render won't overwrite it.
      - key: DATABASE_URL
        sync: false
      # Cloudinary credentials — set these manually in the Render dashboard
      # after the first deploy (cloudinary.com Console -> Dashboard -> "API
      # Environment variable" box has all three). `sync: false` means Render
      # won't overwrite what you type in.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # OTEL_EXPORTER_OTLP_LOGS_ENDPOINT is intentionally unset: without it the
      # app logs JSON to stdout, which Render's own log viewer captures. Add it
      # (plus OTEL_EXPORTER_OTLP_LOGS_HEADERS as a `sync: false` secret) only if
      # you stand up OpenObserve somewhere reachable from Render.
