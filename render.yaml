# Render blueprint — deploy as one Docker web service + managed Postgres.
# In Render: New → Blueprint → connect this repo. No secrets need to be set
# manually; JWT_SECRET is generated by Render and DATABASE_URL is wired from
# the database below.
services:
  - type: web
    name: document-review-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    # Free plan for a $0 demo. Render's free web tier SLEEPS after ~15min idle
    # and its filesystem is ephemeral — uploaded files won't survive a restart
    # or redeploy. For real use, switch to `plan: starter` and add a persistent
    # disk mounted at /app/uploads.
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      # Session/JWT signing secret — Render generates a strong value.
      - key: JWT_SECRET
        generateValue: true
      # Managed Postgres connection string (from the database below).
      - key: DATABASE_URL
        fromDatabase:
          name: document-review-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /app/uploads
      # OTEL_EXPORTER_OTLP_LOGS_ENDPOINT is intentionally unset: without it the
      # app logs JSON to stdout, which Render's own log viewer captures. Add it
      # (plus OTEL_EXPORTER_OTLP_LOGS_HEADERS as a `sync: false` secret) only if
      # you stand up OpenObserve somewhere reachable from Render.

databases:
  - name: document-review-db
    plan: free # 90-day free Postgres; upgrade before it expires for real use
